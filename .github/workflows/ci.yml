name: CI

on:
  push:
  pull_request:

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # bounded — never let a hung job run forever

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose syntax
        run: docker compose -p barq-assessment config

      - name: Create env file
        run: cp .env.example .env 2>/dev/null || true

      - name: Build images
        run: docker compose -p barq-assessment build

      - name: Start environment
        run: docker compose -p barq-assessment up -d

      - name: Wait for services to become healthy
        run: |
          echo "Waiting for all services to report healthy (bounded, 60s max)..."
          deadline=$((SECONDS + 60))
          until [ "$(docker compose -p barq-assessment ps --format json | grep -c '"Health":"healthy"')" -ge 4 ] || [ $SECONDS -ge $deadline ]; do
            sleep 3
          done
          docker compose -p barq-assessment ps

      - name: Run validate.py
        run: python3 validate.py

      - name: Show logs on failure
        if: failure()
        run: docker compose -p barq-assessment logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose -p barq-assessment down -v
