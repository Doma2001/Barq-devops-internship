name: CI

on:
  push:
  pull_request:

jobs:
  validate-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # bounded — never let a hung job run forever

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create env files (from CI secret)
        run: |
          echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" > .env
          echo "PUBLIC_PORT=8080" >> .env
          cat > config/app.env << EOF
          DATABASE_URL=postgresql://barq_app:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/barq_tasks
          REDIS_URL=redis://redis:6379/0
          EOF

      - name: Validate docker-compose syntax
        run: docker compose -p barq-assessment config

      - name: Build images
        run: docker compose -p barq-assessment build

      - name: Start environment
        run: docker compose -p barq-assessment up -d

      - name: Wait for services to become healthy
        run: |
          echo "Waiting for /ready to return 200 (bounded, 60s max)..."
          deadline=$((SECONDS + 60))
          until curl -sf http://127.0.0.1:8080/ready > /dev/null || [ $SECONDS -ge $deadline ]; do
            echo "not ready yet, retrying..."
            sleep 3
          done
          curl -i http://127.0.0.1:8080/ready || true
          docker compose -p barq-assessment ps

      - name: Run validate.py
        run: python3 validate.py

      - name: Show logs on failure
        if: failure()
        run: docker compose -p barq-assessment logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose -p barq-assessment down -v
